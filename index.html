<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faroe Travel — Package holidays to the Faroe Islands</title>
<meta name="description" content="Package holidays to the Faroe Islands: flights, hotels, cottages, rental cars, bus passes and local experiences — planned by locals.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f2230; --ink-2:#3c5363; --muted:#6c8090;
    --sea:#14384f; --sea-2:#1f5677; --moss:#4f7a4a; --moss-2:#e7efe3;
    --sand:#f6f1e8; --card:#ffffff; --line:#e3e7ea;
    --accent:#d9822b; --accent-2:#f3c38a;
    --radius:16px; --shadow:0 10px 30px rgba(15,34,48,.10);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--sand);line-height:1.55}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0 0 .4em}
  a{color:inherit}
  img{max-width:100%;display:block}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .btn{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:0;cursor:pointer;font:600 15px Inter,sans-serif;padding:12px 20px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;transition:.15s}
  .btn:hover{filter:brightness(.95);transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--sea);border:1.5px solid var(--sea)}
  .btn.small{padding:8px 14px;font-size:14px}
  .btn.done{background:var(--moss);color:#fff;border-color:var(--moss)}
  .tag{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--moss-2);color:var(--moss)}
  section{padding:72px 0}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--moss)}
  .section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
  .section-head p{margin:0;color:var(--ink-2);max-width:560px}

  /* Header */
  header.top{position:sticky;top:0;z-index:50;background:rgba(246,241,232,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px}
  .logo{display:flex;align-items:center;gap:10px;white-space:nowrap;font:700 20px Fraunces,serif;text-decoration:none;color:var(--sea)}
  .logo svg{width:34px;height:34px}
  .nav ul{display:flex;gap:18px;list-style:none;margin:0;padding:0}
  .nav ul a{text-decoration:none;font-weight:500;color:var(--ink-2);font-size:15px;white-space:nowrap}
  .nav ul a:hover{color:var(--sea)}
  .nav-right{display:flex;align-items:center;gap:12px}
  .lang select{width:auto;padding:7px 30px 7px 12px;border-radius:999px;font:600 13.5px Inter;color:var(--sea);cursor:pointer}
  /* hide Google Translate's own banner/tooltips */
  .goog-te-banner-frame,.skiptranslate iframe,#goog-gt-tt,.goog-te-balloon-frame{display:none!important}
  body{top:0!important}
  .goog-text-highlight{background:none!important;box-shadow:none!important}
  .menu-btn{display:none;background:none;border:0;font-size:26px;cursor:pointer;color:var(--sea)}

  /* Hero */
  .hero{position:relative;color:#fff;padding:110px 0 70px;overflow:hidden;background:var(--sea);min-height:88vh;display:flex;align-items:center}
  .hero > .wrap{width:100%}
  .hero .bg{position:absolute;inset:-4%;background-size:cover;background-position:center 40%;animation:kenburns 26s ease-in-out infinite alternate}
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
  @media (prefers-reduced-motion:reduce){.hero .bg{animation:none}}
  .hero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,28,40,.82),rgba(10,28,40,.25))}
  .hero .wrap{position:relative}
  .hero h1{font-size:clamp(40px,7vw,78px);max-width:780px;text-shadow:0 4px 24px rgba(0,0,0,.35)}
  .hero h1 em{font-style:italic;color:var(--accent-2)}
  .stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:34px}
  .stats div b{display:block;font:700 30px Fraunces,serif;color:#fff}
  .stats div span{font-size:13px;opacity:.8;text-transform:uppercase;letter-spacing:.08em}
  .hero p.lead{font-size:19px;max-width:560px;opacity:.92}
  .hero-points{display:flex;gap:22px;flex-wrap:wrap;margin:22px 0 0;padding:0;list-style:none;font-weight:500}
  .hero-points li::before{content:"✓ ";color:var(--accent-2)}
  .search{margin-top:36px;background:#fff;color:var(--ink);border-radius:20px;padding:16px;display:grid;grid-template-columns:repeat(4,1fr) auto;gap:12px;box-shadow:var(--shadow);max-width:980px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px 4px}
  select,input,textarea{width:100%;font:15px Inter,sans-serif;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--sea-2)}
  .search .btn{align-self:end;height:46px}

  /* Mosaic */
  .mosaic{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:210px;gap:14px}
  .tile{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;background:var(--sea-2)}
  .tile .ph{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .7s ease}
  .tile:hover .ph{transform:scale(1.08)}
  .tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.65))}
  .tile .cap{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;color:#fff}
  .tile .cap b{display:block;font:700 24px Fraunces,serif}
  .tile .cap span{font-size:13.5px;opacity:.9}
  .tile.big{grid-column:span 2;grid-row:span 2}
  .tile.big .cap b{font-size:34px}
  .tile.wide{grid-column:span 2}
  @media (max-width:800px){.mosaic{grid-template-columns:1fr 1fr;grid-auto-rows:170px}.tile.big{grid-column:span 2;grid-row:span 2}.tile.wide{grid-column:span 2}}

  /* Scroll reveal */
  .reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
  .reveal.in{opacity:1;transform:none}

  /* Packages */
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:500 14px Inter;cursor:pointer;color:var(--ink-2)}
  .chip.active{background:var(--sea);border-color:var(--sea);color:#fff}
  .toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .toolbar select{width:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
  .card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.2s}
  .card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(15,34,48,.18)}
  .card .img{height:240px;position:relative;overflow:hidden}
  .card .img .ph{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .6s ease}
  .card:hover .img .ph{transform:scale(1.07)}
  .card .img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
  .card .img .from{position:absolute;bottom:14px;left:14px;z-index:2;color:#fff;font:700 22px Fraunces,serif;text-shadow:0 2px 8px rgba(0,0,0,.4)}
  .card .img .from small{display:block;font:600 11px Inter;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
  .card .img .badge{z-index:2;position:absolute;top:14px;left:14px;background:#fff;color:var(--sea);font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
  .card .img .days{z-index:2;position:absolute;backdrop-filter:blur(4px);bottom:14px;right:14px;background:rgba(15,34,48,.8);color:#fff;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px}
  .card .body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
  .card h3{font-size:22px;margin:0}
  .card p{margin:0;color:var(--ink-2);font-size:15px}
  .includes{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
  .includes span{font-size:12.5px;background:var(--sand);padding:4px 9px;border-radius:8px;color:var(--ink-2)}
  .card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
  .price small{display:block;font-size:12px;color:var(--muted)}
  .price strong{font:700 24px Fraunces,serif;color:var(--sea)}
  .empty{padding:40px;text-align:center;background:#fff;border-radius:var(--radius);color:var(--muted)}

  /* Experiences */
  .exp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .exp{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .exp .pic{height:170px;background:var(--sea-2) center/cover;position:relative;transition:transform .2s}
  .exp{transition:transform .2s, box-shadow .2s}
  .exp:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(15,34,48,.18)}
  .exp .pic .ico{position:absolute;left:14px;bottom:-20px;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow)}
  .exp .txt{padding:26px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
    .exp h3{font-size:18px;margin:4px 0 0}
  .exp p{margin:0;color:var(--ink-2);font-size:14px}
  .exp .meta{font-size:12.5px;color:var(--muted)}
  .exp .row2{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}
  .exp .row2 b{color:var(--sea);font-family:Fraunces,serif;font-size:18px}

  /* Builder */
  .builder-wrap{background:#fff;border-radius:24px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.4fr 1fr;overflow:hidden}
  .builder{padding:28px}
  .step{margin-bottom:26px}
  .step h4{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:10px}
  .step h4 .n{width:26px;height:26px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .opt{position:relative}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt label{display:block;border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;height:100%;transition:.15s;background:#fff}
  .opt label b{display:block;font-size:14.5px}
  .opt label span{font-size:12.5px;color:var(--muted)}
  .opt label em{display:block;font-style:normal;font-weight:600;font-size:13px;color:var(--sea-2);margin-top:4px}
  .opt input:checked + label{border-color:var(--sea);background:#eef4f8;box-shadow:inset 0 0 0 1px var(--sea)}
  .summary{background:var(--sea);color:#fff;padding:28px;display:flex;flex-direction:column}
  .summary h3{color:#fff}
  .summary table{width:100%;border-collapse:collapse;font-size:14px}
  .summary td{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.12);vertical-align:top}
  .summary td:last-child{text-align:right;white-space:nowrap;padding-left:10px}
  .summary .total{margin:18px 0 6px;display:flex;justify-content:space-between;align-items:end}
  .summary .total strong{font:700 34px Fraunces,serif}
  .summary .pp{opacity:.8;font-size:14px}
  .summary .note{font-size:12.5px;opacity:.75;margin-top:10px}
  .guarantee{background:rgba(255,255,255,.1);border-radius:12px;padding:12px;font-size:13.5px;margin-top:14px}
  .warn{background:#fff4e5;color:#7a4b10;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px;display:none}
  .summary .warn{margin:12px 0 0}
  .summary .btn{margin-top:auto;justify-content:center}
  .spacer{height:16px}

  /* Info */
  .info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .info{background:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
  .info .ico{font-size:28px}
  .info h3{font-size:19px;margin:8px 0 6px}
  .info p{margin:0;color:var(--ink-2);font-size:14.5px}

  /* Seasons */
  .seasons{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
  .month{background:#fff;border-radius:12px;padding:12px 6px;text-align:center;font-size:12.5px;box-shadow:var(--shadow)}
  .month b{display:block;font-size:14px;margin-bottom:6px}
  .month .bar{height:6px;border-radius:4px;margin:6px auto 0;width:80%}
  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13.5px;color:var(--ink-2)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

  /* Why */
  .why{position:relative;color:#fff;background:var(--sea) center/cover;overflow:hidden}
  .why::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(47,82,51,.92),rgba(20,56,79,.80))}
  .why .wrap{position:relative}
  .why h2{color:#fff}
  .why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:20px}
  .why-grid div{border-top:2px solid rgba(255,255,255,.35);padding-top:14px}
  .why-grid b{display:block;font:600 19px Fraunces,serif;margin-bottom:6px}
  .why-grid p{margin:0;opacity:.88;font-size:14.5px}

  /* Reviews */
  .reviews{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .review{background:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
  .review .stars{color:var(--accent);letter-spacing:2px}
  .review p{color:var(--ink-2);font-style:italic}
  .review small{color:var(--muted)}

  /* FAQ */
  details{background:#fff;border-radius:14px;padding:16px 20px;margin-bottom:10px;box-shadow:var(--shadow)}
  summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
  summary::after{content:"+";font-size:20px;color:var(--sea-2)}
  details[open] summary::after{content:"–"}
  details p{margin:10px 0 0;color:var(--ink-2)}

  /* Contact */
  .contact{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start}
  .contact form{background:#fff;padding:26px;border-radius:20px;box-shadow:var(--shadow);display:grid;gap:12px}
  .contact .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  footer{background:var(--ink);color:#c9d4dc;padding:50px 0 30px;font-size:14px}
  footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px}
  footer h4{color:#fff;margin:0 0 10px;font-size:15px}
  footer ul{list-style:none;padding:0;margin:0;display:grid;gap:6px}
  footer a{text-decoration:none}
  footer a:hover{color:#fff}
  footer .legal{border-top:1px solid #2a3d4b;margin-top:30px;padding-top:18px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:#8ea0ad}

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(10,24,34,.6);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
  .modal.open{display:flex}
  .modal-box{background:#fff;border-radius:22px;max-width:860px;width:100%;overflow:hidden;position:relative}
  .modal-box .img{height:260px;background-size:cover;background-position:center}
  .modal-box .close{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:22px;cursor:pointer;box-shadow:var(--shadow)}
  .modal-content{padding:28px}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:18px 0;overflow-x:auto}
  .tabs button{background:none;border:0;padding:10px 14px;font:600 14.5px Inter;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.active{color:var(--sea);border-color:var(--sea)}
  .tab{display:none}.tab.active{display:block}
  .day{display:grid;grid-template-columns:80px 1fr;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .day b{color:var(--sea-2)}
  .day p{margin:0;color:var(--ink-2)}
  .inc-list{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .inc-list ul{padding-left:18px;margin:6px 0}
  .inc-list li{margin-bottom:4px;color:var(--ink-2)}
  .modal-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 28px;background:var(--sand)}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:14px 22px;border-radius:12px;z-index:200;transition:.3s;box-shadow:var(--shadow)}
  .toast.show{transform:translateX(-50%) translateY(0)}

  @media (max-width:1240px){
    .nav ul{display:none;position:absolute;top:66px;left:0;right:0;background:var(--sand);flex-direction:column;padding:16px 20px;gap:14px;border-bottom:1px solid var(--line)}
    .nav ul.open{display:flex}
    .menu-btn{display:block}
  }
  @media (max-width:600px){ .nav-right .btn{display:none} .lang select{max-width:136px;font-size:13px;padding:6px 22px 6px 8px} .logo{font-size:18px} .hero{min-height:auto;padding:70px 0 50px} .stats{gap:20px} .stats div b{font-size:24px} .card .img{height:220px} }
  @media (max-width:1000px){
    .search{grid-template-columns:1fr 1fr}
    .search .btn{grid-column:1/-1}
    .builder-wrap{grid-template-columns:1fr}
    .why-grid{grid-template-columns:1fr 1fr}
    .contact{grid-template-columns:1fr}
    footer .cols{grid-template-columns:1fr 1fr}
    .seasons{grid-template-columns:repeat(6,1fr)}
  }
  @media (max-width:560px){
    .search{grid-template-columns:1fr}
    .inc-list,.contact .two{grid-template-columns:1fr}
    .why-grid{grid-template-columns:1fr}
    section{padding:52px 0}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap nav">
    <a href="#" class="logo notranslate" aria-label="Faroe Travel">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#14384f"/><path d="M6 27 L15 14 L20 20 L26 11 L34 27 Z" fill="#4f7a4a"/><path d="M6 27 H34 V30 Q20 34 6 30 Z" fill="#1f5677"/><circle cx="28" cy="10" r="3" fill="#f3c38a"/></svg>
      Faroe Travel
    </a>
    <ul id="menu">
      <li><a href="#places" data-i18n="nav_places"></a></li>
      <li><a href="#packages" data-i18n="nav_packages"></a></li>
      <li><a href="#experiences" data-i18n="nav_experiences"></a></li>
      <li><a href="#builder" data-i18n="nav_builder"></a></li>
      <li><a href="#info" data-i18n="nav_info"></a></li>
      <li><a href="#seasons" data-i18n="nav_seasons"></a></li>
      <li><a href="#faq" data-i18n="nav_faq"></a></li>
      <li><a href="#contact" data-i18n="nav_contact"></a></li>
    </ul>
    <div class="nav-right">
      <div class="lang notranslate"><select id="langSelect" aria-label="Language"></select></div>
      <div id="google_translate_element" style="display:none"></div>
      <a href="#builder" class="btn small" data-i18n="cta_plan"></a>
      <button class="menu-btn" aria-label="Menu" onclick="document.getElementById('menu').classList.toggle('open')">☰</button>
    </div>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="bg" id="heroBg"></div>
  <div class="wrap">
    <span class="eyebrow" style="color:var(--accent-2)" data-i18n="hero_eyebrow"></span>
    <h1 data-i18n="hero_title"></h1>
    <p class="lead" data-i18n="hero_lead"></p>
    <ul class="hero-points">
      <li data-i18n="hp1"></li>
      <li data-i18n="hp2"></li>
      <li data-i18n="hp3"></li>
      <li data-i18n="hp4"></li>
    </ul>

    <form class="search" id="quickSearch">
      <div class="field"><label for="qsFrom" data-i18n="qs_from"></label><select id="qsFrom"></select></div>
      <div class="field"><label for="qsMonth" data-i18n="qs_month"></label><select id="qsMonth"></select></div>
      <div class="field"><label for="qsStyle" data-i18n="qs_style"></label><select id="qsStyle"></select></div>
      <div class="field"><label for="qsBudget" data-i18n="qs_budget"></label><select id="qsBudget"></select></div>
      <button class="btn" type="submit" data-i18n="qs_btn"></button>
    </form>

/* =========================================================
   PRICE CALCULATION
   ========================================================= */
function calc(o){
  const people = o.adults + o.kids;
  const lines = [];
  const ap = byId(AIRPORTS, o.from);
  const flight = ap.price * o.adults + ap.price * 0.75 * o.kids;
  if (ap.price) lines.push([t("l_flights",{a:L(ap.name), p:people}), flight]);

  const st = byId(STAYS, o.stay);
  const units = Math.ceil(people / st.cap);
  const stay = st.price * o.nights * units;
  if (st.price) lines.push([`${L(st.name)} · ${t("l_nights",{n:o.nights})}${units>1?" · "+t("l_rooms",{n:units}):""}`, stay]);

  const tr = byId(TRANSPORT, o.transport);
  let trans = 0;
  if (tr.unit === "day"){
    const cars = Math.ceil(people / tr.seats), days = o.nights + 1;
    trans = tr.price * days * cars + TUNNEL_FEE * cars;
    lines.push([`${L(tr.name)} · ${t("l_days",{n:days})}${cars>1?" · "+t("l_cars",{n:cars}):""} ${t("l_tunnels")}`, trans]);
  } else if (tr.unit === "ppday"){
    trans = tr.price * (o.nights + 1) * people;
    lines.push([`${L(tr.name)} · ${t("l_pers",{n:people})}`, trans]);
  } else {
    trans = tr.price * people;
    lines.push([L(tr.name), trans]);
  }

  let ex = 0;
  o.extras.forEach(id => {
    const e = byId(EXTRAS, id); if (!e) return;
    const v = e.price * people; ex += v;
    lines.push([`${L(e.name)} × ${people}`, v]);
  });

  const total = flight + stay + trans + ex;
  return {lines, total, pp: total / Math.max(people,1), people};
}

function fromPrice(p){
  const adults = p.adults || 2, kids = p.kids || 0;
  return calc({from:"CPH", nights:p.nights, adults, kids, stay:p.stay, transport:p.transport, extras:p.extras}).total / (adults + kids);
}

function renderGrid(){
  let list = PACKAGES.filter(p =>
    (filter.style === "all" || p.styles.includes(filter.style)) &&
    (!filter.month || inMonth(p.months, +filter.month)) &&
    (!filter.budget || fromPrice(p) <= filter.budget)
  );
  var sorts = {pop:(a,b)=>a.pop-b.pop, low:(a,b)=>fromPrice(a)-fromPrice(b), high:(a,b)=>fromPrice(b)-fromPrice(a), short:(a,b)=>a.nights-b.nights};
  list.sort(sorts[filter.sort]);

  let note = "";
  if (!list.length){
    // relax the filters step by step so visitors always see something
    const tries = [
      p => (filter.style==="all"||p.styles.includes(filter.style)) && (!filter.month||inMonth(p.months,+filter.month)),
      p => (filter.style==="all"||p.styles.includes(filter.style)),
      p => true
    ];
    for (const f of tries){ list = PACKAGES.filter(f); if (list.length) break; }
    list.sort(filter.budget ? (a,b)=>fromPrice(a)-fromPrice(b) : sorts[filter.sort]);
    note = `<div class="empty" style="grid-column:1/-1;padding:16px">${t("relaxed")}</div>`;
  }
  setTimeout(observeReveal, 0);
  $("#grid").innerHTML = note + list.map(p => {
    const st = byId(STAYS,p.stay), tr = byId(TRANSPORT,p.transport);
    return `<article class="card reveal">
      <div class="img" onclick="openModal('${p.id}')" style="cursor:pointer">

        <span class="badge">${L(p.badge)}</span>

        <span class="days">${t("days_nights",{d:p.nights+1,n:p.nights})}</span>
      </div>
      <div class="body">
        <h3>${L(p.title)}</h3>
        <p>${L(p.short)}</p>
        <div class="includes">
          <span>✈ ${t("card_flight")}</span><span>🛏 ${L(st.name)}</span><span>${tr.unit==="day"?"🚗":"🚌"} ${L(tr.name)}</span>
          ${p.extras.slice(0,2).map(id=>`<span>★ ${L(byId(EXTRAS,id).name)}</span>`).join("")}
        </div>
        <div class="foot">
          <span style="font-size:13.5px;color:var(--muted)">${p.months.length ? "📅 "+p.months.map(m=>L(T.months_short)[m-1]).join(", ") : "📅 "+t("ex_all_year")}</span>
          <button class="btn small" onclick="openModal('${p.id}')">${t("card_see")} →</button>

const state = {pkg:"classic", from:"CPH", date:"", nights:4, adults:2, kids:0, stay:"hotel3", transport:"carS", extras:[]};

function optHTML(name, items, type, selected, month){
  return items.map(i => {
    const unit = i.unit==="day" ? t("u_day") : i.unit==="ppday" ? t("u_ppday") : (i.unit==="pp" || type==="checkbox") ? t("u_pp") : t("u_night");
    const chk = type==="checkbox" ? selected.includes(i.id) : selected===i.id;
    const off = type==="checkbox" && month && !inMonth(i.months, month) ? t("not_season") : "";
    return `<div class="opt"><input type="${type}" name="${name}" id="${name}-${i.id}" value="${i.id}" ${chk?"checked":""}>
      <label for="${name}-${i.id}"><b>${L(i.name)}</b><span>${L(i.desc)}${off}</span><em>${i.price?fmt(i.price)+unit:"—"}</em></label></div>`;
  }).join("");
}

function renderBuilderOptions(){
  const month = state.date ? new Date(state.date).getMonth()+1 : null;
  $("#stayOpts").innerHTML = optHTML("stay", STAYS, "radio", state.stay);
  $("#transportOpts").innerHTML = optHTML("transport", TRANSPORT, "radio", state.transport);
  $("#extraOpts").innerHTML = optHTML("extra", EXTRAS, "checkbox", state.extras, month);
  document.querySelectorAll('input[name=stay]').forEach(i => i.onchange = () => { state.stay = i.value; updateSummary(); });
  document.querySelectorAll('input[name=transport]').forEach(i => i.onchange = () => { state.transport = i.value; updateSummary(); });
  document.querySelectorAll('input[name=extra]').forEach(i => i.onchange = () => {
    state.extras = [...document.querySelectorAll('input[name=extra]:checked')].map(x=>x.value);
    renderExperiences(); updateSummary();
  });
}

function loadPackage(id){
  const p = byId(PACKAGES,id);
  Object.assign(state, {pkg:id, nights:p.nights, stay:p.stay, transport:p.transport, extras:[...p.extras], adults:p.adults||state.adults, kids:p.kids??state.kids});
  if (!state.date || !inMonth(p.months, new Date(state.date).getMonth()+1)) state.date = nextDateInSeason(p.months);
  syncInputs(); renderBuilderOptions(); renderExperiences(); updateSummary();
}

function nextDateInSeason(months){
  const d = new Date(); d.setDate(d.getDate()+30);
  for (let i=0;i<14;i++){ if (inMonth(months, d.getMonth()+1)) break; d.setMonth(d.getMonth()+1); d.setDate(1); }
  return d.toISOString().slice(0,10);
}

function isCustomised(p){
  return p.nights!==state.nights || p.stay!==state.stay || p.transport!==state.transport || p.extras.slice().sort().join()!==state.extras.slice().sort().join();
}

function updateSummary(){
  const month = state.date ? new Date(state.date).getMonth()+1 : null;
  const r = calc(state);
  const p = byId(PACKAGES,state.pkg);
  $("#sumTitle").textContent = p ? L(p.title) + (isCustomised(p) ? " " + t("customised") : "") : t("own_trip");
  if (state.date){
    const a = new Date(state.date), b = new Date(a); b.setDate(b.getDate()+state.nights);
    const o = {day:"numeric", month:"short", year:"numeric"}, loc = LANG==="da" ? "da-DK" : "en-GB";
    $("#sumDates").textContent = `${a.toLocaleDateString(loc,o)} – ${b.toLocaleDateString(loc,o)} · ${t("travellers",{n:r.people})}`;
  }
  $("#sumTable").innerHTML = r.lines.map(l => `<tr><td>${l[0]}</td><td>${fmt(l[1])}</td></tr>`).join("");
  $("#sumTotal").textContent = fmt(r.total);
  $("#sumPP").textContent = t("per_person",{p:fmt(r.pp)});

  const ap = byId(AIRPORTS, state.from), fw = $("#flightWarn");
  if (month && !inMonth(ap.months, month)){ fw.style.display="block"; fw.textContent = t("w_flight",{a:L(ap.name), m:ap.months.map(monthName).join(", ")}); }
  else fw.style.display="none";
  const bad = state.extras.map(id=>byId(EXTRAS,id)).filter(e => month && !inMonth(e.months, month)), ew = $("#extraWarn");
  if (bad.length){ ew.style.display="block"; ew.textContent = t("w_extra",{m:monthName(month), x:bad.map(e=>L(e.name)).join(", ")}); }
  else ew.style.display="none";

  $("#contactSummary").innerHTML = `<b>${$("#sumTitle").textContent}</b><br>${$("#sumDates").textContent}<br>${L(ap.name)} · ${L(byId(STAYS,state.stay).name)} · ${L(byId(TRANSPORT,state.transport).name)}${state.extras.length?"<br>"+state.extras.map(id=>L(byId(EXTRAS,id).name)).join(", "):""}<br><b>${t("total")}: ${fmt(r.total)}</b>`;
  try { localStorage.setItem("ft_trip", JSON.stringify(state)); } catch(e){}
}

function tripText(){
  const r = calc(state);
  return `${$("#sumTitle").textContent}\n${$("#sumDates").textContent}\n\n` + r.lines.map(l => `- ${l[0]}: ${fmt(l[1])}`).join("\n") + `\n\n${t("total").toUpperCase()}: ${fmt(r.total)} (${t("per_person",{p:fmt(r.pp)})})`;
}

function syncInputs(){
  $("#bPackage").value = state.pkg; $("#bDate").value = state.date; $("#bNights").value = state.nights;
  $("#bAdults").value = state.adults; $("#bKids").value = state.kids; $("#bFrom").value = state.from;
}

/* =========================================================
   LANGUAGE
   ========================================================= */
// --- automatic translation (Google Translate) ---
function getAutoLang(){
  const m = document.cookie.match(/(?:^|;\s*)googtrans=\/en\/([^;]+)/);
  return m && AUTO_LANGS[decodeURIComponent(m[1])] ? decodeURIComponent(m[1]) : null;
}
function setGoogCookie(val){
  const host = location.hostname, exp = val ? "" : ";expires=Thu, 01 Jan 1970 00:00:00 GMT";
  const v = val ? `/en/${val}` : "";
  document.cookie = `googtrans=${v};path=/${exp}`;
  if (host && host.includes(".")) document.cookie = `googtrans=${v};path=/;domain=.${host}${exp}`;
}
function loadGoogleTranslate(){
  window.googleTranslateElementInit = () => new google.translate.TranslateElement({pageLanguage:"en", autoDisplay:false}, "google_translate_element");
  const s = document.createElement("script");
  s.src = "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
  document.body.appendChild(s);
}
function renderLangSelect(){
  const auto = getAutoLang();
  const cur = auto || LANG;
  $("#langSelect").innerHTML =
    Object.entries(LANGS).map(([k,v]) => `<option value="${k}" ${k===cur?"selected":""}>${v}</option>`).join("") +
    `<optgroup label="Auto-translated">` +
    Object.entries(AUTO_LANGS).map(([k,v]) => `<option value="${k}" ${k===cur?"selected":""}>${v}</option>`).join("") +
    `</optgroup>`;
}
function chooseLang(code){
  const wasAuto = !!getAutoLang();
  if (AUTO_LANGS[code]){
    try { localStorage.setItem("ft_lang", "en"); } catch(e){}
    setGoogCookie(code); location.reload(); return;
  }
  setGoogCookie(null);
  if (wasAuto){ try { localStorage.setItem("ft_lang", code); } catch(e){} location.reload(); return; }
  setLang(code);
}

function setLang(l){
  LANG = LANGS[l] ? l : "en";
  try { localStorage.setItem("ft_lang", LANG); } catch(e){}
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => el.innerHTML = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  renderLangSelect();

  // selects
  const apOpts = AIRPORTS.map(a => `<option value="${a.code}">${L(a.name)}${a.code!=="NONE"?` (${a.code})`:""}</option>`).join("");
  const keep = (sel, html) => { const v = $(sel).value; $(sel).innerHTML = html; if (v) $(sel).value = v; };
  keep("#qsFrom", apOpts); keep("#bFrom", apOpts);
  keep("#qsMonth", `<option value="">${t("qs_any_month")}</option>` + L(T.months).map((m,i)=>`<option value="${i+1}">${m[0].toUpperCase()+m.slice(1)}</option>`).join(""));
  keep("#qsStyle", STYLES.map(s=>`<option value="${s.id}">${s.id==="all"?t("qs_all_styles"):L(s.name)}</option>`).join(""));
  keep("#qsBudget", `<option value="0">${t("qs_any_budget")}</option>` + [6000,9000,12000].map(n=>`<option value="${n}">${t("qs_upto",{n:fmt(n)})}</option>`).join(""));
  keep("#sort", ["pop","low","high","short"].map(k=>`<option value="${k}">${t("sort_"+k)}</option>`).join(""));
  keep("#bPackage", PACKAGES.map(p=>`<option value="${p.id}">${L(p.title)}</option>`).join(""));
  $("#bFrom").value = state.from; $("#bPackage").value = state.pkg;

  $("#footTrips").innerHTML = PACKAGES.slice(0,6).map(p=>`<li><a href="#packages" onclick="openModal('${p.id}')">${L(p.title)}</a></li>`).join("");
  $("#faqList").innerHTML = FAQ.map(f=>`<details><summary>${L(f[0])}</summary><p>${L(f[1])}</p></details>`).join("");
  $("#mosaic").innerHTML = PLACES.map(pl => `<div class="tile ${pl.cls} reveal" onclick="pickStyle('${pl.filter}')">
      <div class="ph" style="background-image:url('${PHOTO(pl.photo, pl.cls==="big"?1400:800)}')"></div>
      <div class="cap"><b>${L(pl.name)}</b><span>${L(pl.text)}</span></div></div>`).join("");
  $("#statTrips").textContent = PACKAGES.length;
  $("#infoGrid").innerHTML = INFO.map(i=>`<div class="info reveal"><div class="ico">${i.ico}</div><h3>${L(i.t)}</h3><p>${L(i.p)}</p></div>`).join("");
  $("#seasonGrid").innerHTML = SEASONS.map((s,i)=>`<div class="month"><b>${L(T.months_short)[i]}</b>${s[0]}°C<br>☀ ${s[1]}h
    ${s[2]?'<div class="bar" style="background:#4f7a4a"></div>':""}${s[3]?'<div class="bar" style="background:#d9822b"></div>':""}${s[4]?'<div class="bar" style="background:#1f5677"></div>':""}</div>`).join("");
  if (REVIEWS.length){
    $("#reviewsSection").style.display = "";
    $("#reviews").innerHTML = REVIEWS.map(r=>`<div class="review"><div class="stars">${"★".repeat(r.stars)}</div><p>“${L(r.text)}”</p><small>${r.name}${r.trip?" · "+L(byId(PACKAGES,r.trip).title):""}</small></div>`).join("");
  }
  $("#contactSummary").textContent = t("sel_empty");

  renderChips(); renderGrid(); renderExperiences(); renderBuilderOptions(); updateSummary(); fillModal();
  observeReveal();
}

/* =========================================================
   INIT
   ========================================================= */
function init(){
  $("#heroBg").style.backgroundImage = `url('${PHOTO(HERO_PHOTO,1920)}'), ` + scene({sky:["#6f93ab","#e2cfb1"], m:["#4d6e60","#34554a","#1d3830"], sea:"#173f57", sun:"#f5d29a"});
  $("#whySec").style.backgroundImage = `url('${PHOTO(32315716,1600)}')`;
  $("#year").textContent = new Date().getFullYear();
  $("#mailLink").href = "mailto:"+BOOKING_EMAIL; $("#mailLink").textContent = BOOKING_EMAIL;
  $("#footMail").textContent = BOOKING_EMAIL; $("#phoneText").textContent = PHONE; $("#footPhone").textContent = PHONE;
  $("#regText").textContent = REGISTRATION;

  let saved = null; try { saved = JSON.parse(localStorage.getItem("ft_trip")); } catch(e){}
  if (saved && byId(PACKAGES, saved.pkg)) Object.assign(state, saved);
  else { const p = byId(PACKAGES,"classic"); state.date = nextDateInSeason(p.months); }

  // English is the default. A visitor's own choice is remembered.
  let lang = null; try { lang = localStorage.getItem("ft_lang"); } catch(e){}
  if (getAutoLang()) lang = "en";            // auto-translation always starts from the English text
  setLang(lang || "en");
  syncInputs();
  $("#langSelect").onchange = e => chooseLang(e.target.value);
  if (getAutoLang()) loadGoogleTranslate();

  $("#quickSearch").onsubmit = e => {
    e.preventDefault();
    filter.style = $("#qsStyle").value; filter.month = $("#qsMonth").value; filter.budget = +$("#qsBudget").value;
    state.from = $("#qsFrom").value; $("#bFrom").value = state.from;
    renderChips(); renderGrid(); updateSummary();
    document.getElementById("packages").scrollIntoView();
  };
  $("#sort").onchange = e => { filter.sort = e.target.value; renderGrid(); };

  $("#bPackage").onchange = e => loadPackage(e.target.value);
  $("#bDate").onchange = e => { state.date = e.target.value; renderBuilderOptions(); updateSummary(); };
  $("#bNights").oninput = e => { state.nights = Math.min(21, Math.max(2, +e.target.value||2)); updateSummary(); };
  $("#bAdults").oninput = e => { state.adults = Math.max(1, +e.target.value||1); updateSummary(); };
  $("#bKids").oninput = e => { state.kids = Math.max(0, +e.target.value||0); updateSummary(); };
  $("#bFrom").onchange = e => { state.from = e.target.value; updateSummary(); };

  $("#bookingForm").onsubmit = async e => {
    e.preventDefault();
    const data = {name:$("#fName").value, email:$("#fEmail").value, phone:$("#fPhone").value, country:$("#fCountry").value, message:$("#fMsg").value, language:LANG, trip:tripText()};
    if (FORM_ENDPOINT){
      try {
        const res = await fetch(FORM_ENDPOINT, {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body:JSON.stringify(data)});
        if (!res.ok) throw new Error();
        toast(t("toast_ok")); e.target.reset(); return;
      } catch(err){ toast(t("toast_err")); }
    }
    const body = `${data.name}\n${data.email}\n${data.phone}\n${data.country}\n\n${data.trip}\n\n${data.message}`;
    location.href = `mailto:${BOOKING_EMAIL}?subject=${encodeURIComponent(t("mail_subject")+": "+$("#sumTitle").textContent)}&body=${encodeURIComponent(body)}`;
  };
  $("#newsForm").onsubmit = e => { e.preventDefault(); toast(t("toast_news")); e.target.reset(); };
}

function toast(msg){ const el = $("#toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("show"), 3000); }

init();
</script>
</body>
</html>
